name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Docs consistency
        # Phase 5 gate: every public name listed in docs/API_STABILITY.md must
        # really be exported, every `geo.<method>` must be registered in
        # METHODS, and every doc link / in-repo path reference must resolve.
        run: python scripts/check_docs.py

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/geonexus

      - name: Test with coverage (pytest + coverage)
        run: |
          coverage run -m pytest
          coverage report

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify wheels install
        run: |
          pip install dist/*.whl
          python -c "import geonexus; print('geonexus', geonexus.__version__)"
