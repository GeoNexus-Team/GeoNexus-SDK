recipe_version: "1.0"
id: recipe://geonexus/eaaf-wetland-priority@2.0.0
name: 东亚—澳大利亚迁飞区 · 优先湿地识别（按原文五步复现）
description: >-
  严格按 Crosby et al. 2026（Scientific Reports 16:1916）的五步流程组织：比较三套国际框架 →
  汇集站点与水鸟数据 → 用 CSR1 的 1% 阈值与 PC1 及区域校准阈值取舍 → 与各国专家核定边界（人工步）
  → 刻画沿海/内陆、保护状态与 HDI 并做 χ² 检验。逐笔水鸟计数数据受许可限制未公开，本方案复核
  原文的取舍规则与统计量，不重算 PC1；可用 `counts` 参数导入受限数据走完整计算路径。
license: CC-BY-4.0
tags: [eaaf, waterbird, wetland, rfi, pc1, csr1, real-data]

params:
  - name: data_dir
    type: string
    default: data/rfi
    description: 站点级结果数据集目录（由 extract_supp_table3.py 从论文补充材料生成）。
  - name: threshold_prc_mongolia
    type: number
    default: 10.0
    minimum: 0.0
    maximum: 200.0
    target: s3.params.threshold_prc_mongolia
    description: >-
      原文第七节的区域校准：中国与蒙古 PC1 入选阈值取 10（作者依据专家评审）。改小会纳入更多
      北方站点，名单不再是原文那一份 —— 这是敏感性分析用的，不是默认值。
  - name: threshold_others
    type: number
    default: 1.0
    minimum: 0.0
    maximum: 200.0
    target: s3.params.threshold_others
    description: 其余八国的 PC1 入选阈值（原文取 1）。
  - name: include_expert_exceptions
    type: boolean
    default: true
    target: s3.params.include_expert_exceptions
    description: >-
      是否纳入原文点名的三处蒙古专家例外（Tolbo 9.4 / Terkhiin Tsagaan 6.0 / Buir 8.0）。
      关掉它，中国与蒙古就纯粹按 PC1 ≥ 10 取舍。
  - name: include_published_sites
    type: boolean
    default: true
    target: s3.params.include_published_sites
    description: >-
      公开结果为准：原文补充材料已列为优先站点、但按公开分值严格套用阈值应落选的站点是否保留。
      关掉它得到"纯规则"结果（145 处）；开着得到原文名单（147 处）。差异逐条写进报告。
  - name: one_percent_rule
    type: boolean
    scope: fixed
    default: true
    target: s3.params.one_percent
    description: 1% 规则（Ramsar 第 6 条）是定义，不是可调阈值 —— 关掉它算出来的就不是 PC1。
  - name: counts
    type: string
    default: ""
    target: s3.params.counts
    description: >-
      可选：受限的逐笔水鸟计数数据集（字段见补充材料 Table 1）。给了它才走
      count → CSR1 score → PC1 的完整计算；不给则只复核原文的取舍规则与统计量。
  - name: report_format
    type: enum
    enum: [html]
    default: html
    target: s5.params.format

requires:
  # 公开数据组成项：站点级结果、国别汇总、框架站点数（都来自论文公开的表格）
  - geocard.eaaf.rfi-priority-sites
  - geocard.eaaf.rfi-country-summary
  # 受限组成项：支撑 PC1 的逐笔计数数据（Wetlands International 许可，未公开）。
  # 引用它的组合案例对访客不可见 —— 这正是可见性继承要演示的行为。
  - geocard.eaaf.waterbird-counts-restricted

steps:
  - id: s1
    kind: skill
    uses: rfi-framework-review
    description: 比较 Ramsar / EAAFP 迁飞区网络 / IBA-KBA 三套框架及其水鸟相关标准（原文第一步）。
    params:
      data_dir: ${params.data_dir}
    outputs:
      framework_table: 框架站点数对比表（CSV）
      framework_json: 框架比较明细（JSON，含 Ramsar 第 2/4/5/6 条）
    resources: {cpu: 1, memory_mb: 256}
    timeout_seconds: 120

  - id: s2
    kind: skill
    uses: rfi-site-data
    depends_on: [s1]
    description: 汇集 147 处优先湿地的站点级数据，并校验它与原文公开数字是否一致（第二步）。
    params:
      data_dir: ${params.data_dir}
    outputs:
      sites_table: 规范化站点表（CSV，147 行）
      funnel_json: 候选→评估→入选漏斗与校验结论（JSON）
    resources: {cpu: 1, memory_mb: 512}
    timeout_seconds: 300

  - id: s3
    kind: skill
    uses: rfi-pc1-select
    depends_on: [s2]
    description: >-
      复核 PC1 取舍规则：中国与蒙古阈值 10、其余八国 1，另加 3 处蒙古专家例外；
      给出"能否重现 147 处"的结论（第三步）。
    params:
      data_dir: ${params.data_dir}
      threshold_prc_mongolia: ${params.threshold_prc_mongolia}
      threshold_others: ${params.threshold_others}
      include_expert_exceptions: ${params.include_expert_exceptions}
      one_percent: ${params.one_percent_rule}
      include_published_sites: ${params.include_published_sites}
      counts: ${params.counts}
    outputs:
      selection_table: 逐站点取舍表（CSV，含所用阈值与理由）
      selection_json: 取舍规则与结果（JSON）
    resources: {cpu: 1, memory_mb: 512}
    timeout_seconds: 300

  - id: s4
    kind: skill
    uses: rfi-characterise
    depends_on: [s3]
    description: 刻画沿海/内陆、保护状态与 HDI 档，并用 χ² 复算原文的三个统计量（第五步）。
    params:
      data_dir: ${params.data_dir}
    outputs:
      country_table: 国别刻画表（CSV）
      characterisation_json: 刻画结果与 χ²（JSON）
    resources: {cpu: 1, memory_mb: 256}
    timeout_seconds: 300

  - id: s5
    kind: skill
    uses: rfi-report
    depends_on: [s1, s2, s3, s4]
    description: 按论文形态渲染报告（框架/漏斗/国别表/物种/χ²/局限/数据可用性）。
    params:
      data_dir: ${params.data_dir}
      source:
        citation: "Identifying priority wetland sites in the East Asian–Australasian Flyway for migratory bird conservation"
        doi: "10.1038/s41598-025-31727-2"
        journal: "Scientific Reports 16, 1916 (2026)"
      data_snapshot:
        site_level: supplementary-table-3
        counts: restricted-not-public
    inputs:
      framework: step://s1/framework_json
      funnel: step://s2/funnel_json
      selection: step://s3/selection_json
      characterisation: step://s4/characterisation_json
    outputs:
      report: 评估报告（HTML）
    timeout_seconds: 300

entrypoint: s1

outputs:
  - name: priority_sites
    from: s2.sites_table
    role: data
    media_type: text/csv
    description: 147 处优先湿地站点表（名称、坐标、PC1、达到 1% 的物种数、保护地标记）。
  - name: priority_selection
    from: s3.selection_table
    role: data
    media_type: text/csv
    description: 逐站点取舍表 —— 每个站点用了哪个阈值、为什么入选或落选。
  - name: country_characteristics
    from: s4.country_table
    role: data
    media_type: text/csv
    description: 国别刻画表 —— 沿海/内陆、保护状态、HDI 档与补充材料粗体标记的对照。
  - name: report
    from: s5.report
    role: knowledge
    media_type: text/html
    description: 评估报告 —— 结论、方法、统计检验、局限与数据可用性。

data_snapshot:
  site_level: supplementary-table-3        # 论文补充材料（公开，CC-BY）
  counts: restricted-not-public            # Wetlands International 许可，未公开
  method: "Scientific Reports 16:1916 (2026), DOI 10.1038/s41598-025-31727-2"
