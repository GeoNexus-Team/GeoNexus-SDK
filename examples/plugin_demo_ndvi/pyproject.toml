[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geonexus-plugin-demo-ndvi"
version = "0.1.0"
description = "Demo GeoNexus plugin: an NDVI stats skill and a sample data card, distributed via pip entry-points"
requires-python = ">=3.9"
dependencies = ["geonexus-sdk"]

[project.entry-points."geonexus.plugins"]
demo-ndvi = "geonexus_plugin_demo_ndvi:plugin"

[tool.setuptools]
packages = ["geonexus_plugin_demo_ndvi"]
